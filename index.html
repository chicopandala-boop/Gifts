    <script>
      // Gracefully prevent third-party browser extension errors (e.g. MetaMask inpage.js) from leaking to window error handlers
      (function() {
        function isExtensionError(msg, source) {
          var strMsg = typeof msg === 'string' ? msg : (msg && msg.message) || String(msg || '');
          var strSrc = typeof source === 'string' ? source : '';
          return (
            strSrc.indexOf('chrome-extension://') !== -1 ||
            strSrc.indexOf('moz-extension://') !== -1 ||
            strSrc.indexOf('safari-web-extension://') !== -1 ||
            strMsg.indexOf('MetaMask') !== -1 ||
            strMsg.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1 ||
            strMsg.indexOf('Failed to connect to MetaMask') !== -1
          );
        }

        window.addEventListener('error', function(event) {
          if (isExtensionError(event.message, event.filename)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (isExtensionError(msg, '')) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
